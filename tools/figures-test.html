<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'IM Fell English'; src: url('../fonts/fell-roman.woff2') format('woff2'); }
  body { margin: 0; background: #EAE0C8; }
  canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1280" height="900"></canvas>
<script type="module">
import { figure } from '../film/ink.js';
import { POSES } from '../film/figures.js';
const g = document.getElementById('c').getContext('2d');
g.fillStyle = '#EAE0C8'; g.fillRect(0, 0, 1280, 900);
g.font = '13px serif'; g.fillStyle = '#2A2118';
let i = 0;
for (const [name, pose] of Object.entries(POSES)) {
  const col = i % 6, row = Math.floor(i / 6);
  const x = 110 + col * 200, y = 150 + row * 200;
  const m = figure({ id: 'f' + i, t0: 0, dur: 1, x, y, h: 92, pose });
  m.draw(g, 1, 10);
  g.fillText(name, x - 40, y + 26);
  // bbox outline for debugging
  g.strokeStyle = 'rgba(158,43,37,0.25)';
  g.strokeRect(...m.bbox);
  i++;
}
document.title = 'READY';
</script>
</body></html>
