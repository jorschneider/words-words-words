<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>score test</title></head>
<body>
<script type="module">
import { makeScore } from '../film/score.js';

const SR = 44100;
const EPS = 0.05;                 // module schedules from currentTime + 0.05
const lines = [];
const say = s => lines.push(s);
const checks = [];
const check = (name, ok, detail) => {
  checks.push(ok);
  say((ok ? '[ok]   ' : '[FAIL] ') + name + ' :: ' + detail);
};
const f4 = v => (typeof v === 'number' ? v.toPrecision(4) : String(v));

// ---------------------------------------------------------- fake film
function buildFilm() {
  const ev = [];
  let n = 0;
  const pluckWindows = [];        // [a, b] film-time spans containing ONLY plucks
  function plucks(t, count, gap) {
    pluckWindows.push([t - 0.25, t + (count - 1) * gap + 0.45]);
    for (let i = 0; i < count; i++) ev.push({ t: t + i * gap, type: 'pluck', data: { n: n++ } });
  }
  plucks(2, 6, 1.2);              // slow decode
  plucks(12, 8, 0.5);             // fast decode
  plucks(44, 8, 0.8);             // mid
  ev.push({ t: 10.5, type: 'manicule', data: {} });
  ev.push({ t: 16, type: 'tickrate', data: { rate: 2 } });
  ev.push({ t: 18, type: 'branch', data: { id: 'b1', dur: 3 } });
  ev.push({ t: 20, type: 'tickrate', data: { rate: 4 } });
  ev.push({ t: 20.2, type: 'strike', data: {} });
  ev.push({ t: 21, type: 'heartbeat', data: {} });
  ev.push({ t: 22, type: 'branch', data: { id: 'b2', dur: 4 } });
  ev.push({ t: 24.5, type: 'strike', data: {} });
  ev.push({ t: 26, type: 'tickrate', data: { rate: 1 } });
  ev.push({ t: 28, type: 'inset', data: { dur: 4 } });
  ev.push({ t: 33, type: 'ophelia', data: { dur: 8, granulateAt: 4 } });
  ev.push({ t: 41.5, type: 'mute', data: { dur: 1 } });
  ev.push({ t: 43, type: 'heartbeat', data: {} });
  ev.push({ t: 51, type: 'bell', data: {} });
  ev.sort((a, b) => a.t - b.t);
  const curves = {
    // decays 1 -> 0.2 over 10..30, holds, SNAPS back to 1 at t=40
    commandSat: t => t < 10 ? 1 : t < 30 ? 1 - 0.8 * (t - 10) / 20 : t < 40 ? 0.2 : 1,
    pedalLevel: t => t < 52 ? 0.5 : 0.7,
    roomTone: () => 0.3,
  };
  return { scoreEvents: ev, curves, duration: 60, pluckWindows, pluckCount: n };
}

// ---------------------------------------------------------- rendering
async function render(film, startT, secs) {
  const off = new OfflineAudioContext(1, Math.ceil(SR * secs), SR);
  const bus = off.createGain(); bus.gain.value = 0.5;   // mimic engine scoreBus
  bus.connect(off.destination);
  makeScore(off, bus, film).start(startT);
  const buf = await off.startRendering();
  return buf.getChannelData(0);
}

// ---------------------------------------------------------- analysis
function rms(x, a, b) {
  a = Math.max(0, Math.floor(a * SR)); b = Math.min(x.length, Math.floor(b * SR));
  let s = 0;
  for (let i = a; i < b; i++) s += x[i] * x[i];
  return Math.sqrt(s / Math.max(1, b - a));
}
function peak(x) {
  let p = 0;
  for (let i = 0; i < x.length; i++) { const v = Math.abs(x[i]); if (v > p) p = v; }
  return p;
}
function goertzel(x, f, a, b) {   // normalized magnitude (~amplitude/2 of a sine)
  a = Math.max(0, Math.floor(a * SR)); b = Math.min(x.length, Math.floor(b * SR));
  const w = 2 * Math.PI * f / SR, cw = Math.cos(w);
  let s1 = 0, s2 = 0;
  for (let i = a; i < b; i++) { const s0 = x[i] + 2 * cw * s1 - s2; s2 = s1; s1 = s0; }
  const p = s1 * s1 + s2 * s2 - 2 * cw * s1 * s2;
  return Math.sqrt(Math.max(0, p)) / Math.max(1, b - a);
}
// transient onsets: 5ms-block mean |first difference|, fixed threshold,
// 150ms refractory. Plucks attack hard; pedal/ticks stay under the threshold.
function countOnsets(x, a, b, thresh) {
  const i0 = Math.max(1, Math.floor(a * SR)), i1 = Math.min(x.length, Math.floor(b * SR));
  const blk = Math.floor(SR * 0.005);
  let cnt = 0, lastOn = -1e9;
  for (let i = i0; i + blk <= i1; i += blk) {
    let s = 0;
    for (let j = i; j < i + blk; j++) s += Math.abs(x[j] - x[j - 1]);
    const v = s / blk;
    const tSec = i / SR;
    if (v > thresh && tSec - lastOn > 0.15) { cnt++; lastOn = tSec; }
  }
  return cnt;
}

// ---------------------------------------------------------- run
async function main() {
  const film = buildFilm();
  say('SCORE TEST — words-words-words');
  say('render: 60s OfflineAudioContext, mono ' + SR + 'Hz, scoreBus gain 0.5');
  say('');

  const x = await render(film, 0, 60);
  const B = t => t + EPS;         // film time -> buffer time (startT = 0)

  // 1. overall RMS + peak
  const oRms = rms(x, 0, 60), oPk = peak(x);
  check('overall RMS in [0.02, 0.08]', oRms >= 0.02 && oRms <= 0.08, 'rms=' + f4(oRms));
  check('peak < 0.5', oPk < 0.5, 'peak=' + f4(oPk));

  // 2. 5s window RMS table
  say('');
  say('RMS per 5s window:');
  for (let w = 0; w < 12; w++) {
    say('  [' + (w * 5) + '-' + (w * 5 + 5) + 's] rms=' + f4(rms(x, B(w * 5), B(w * 5 + 5))));
  }
  say('');

  // 3. mute window total silence (mute at 41.5 dur 1: hold 41.53..42.5)
  const mRms = rms(x, B(41.6), B(42.45));
  check('mute window silent (RMS < 0.0005)', mRms < 0.0005, 'rms[41.6-42.45]=' + f4(mRms));

  // 4. spectral: D2 pedal root at ~73.4Hz present (vs off-pitch neighbors)
  const g73 = goertzel(x, 73.416, B(5), B(10));
  const gN = 0.5 * (goertzel(x, 65, B(5), B(10)) + goertzel(x, 82, B(5), B(10)));
  check('pedal 73.4Hz energy present', g73 > 0.004 && g73 > 4 * gN,
    'g73=' + f4(g73) + ' neighbors=' + f4(gN) + ' ratio=' + f4(g73 / Math.max(1e-9, gN)));

  // 5. pedal detune follows commandSat: at t=25 sat=0.4 -> ratio 1.4485
  const fDet = 73.416 * (Math.SQRT2 + (1.5 - Math.SQRT2) * 0.4);
  const fPure = 73.416 * 1.5;
  const gDet = goertzel(x, fDet, B(25.1), B(26.1));
  const gPure5 = goertzel(x, fPure, B(25.1), B(26.1));
  check('pedal upper voice detuned at t=25 (' + f4(fDet) + 'Hz beats ' + f4(fPure) + 'Hz)',
    gDet > 3 * gPure5, 'gDetuned=' + f4(gDet) + ' gPureFifth=' + f4(gPure5));
  // ...and snapped back in tune after t=40 re-injection
  const gDet2 = goertzel(x, 73.416 * (Math.SQRT2 + (1.5 - Math.SQRT2) * 0.2), B(45.5), B(46.5));
  const gPure2 = goertzel(x, fPure, B(45.5), B(46.5));
  check('pedal snapped to pure fifth after t=40', gPure2 > 3 * gDet2,
    'gPureFifth=' + f4(gPure2) + ' gTritoneSide=' + f4(gDet2));

  // 6. pluck onsets within 20% of scheduled
  let onsets = 0;
  const perWin = [];
  for (const [a, b] of film.pluckWindows) {
    const c = countOnsets(x, B(a), B(b), 0.012);
    perWin.push(c); onsets += c;
  }
  const lo = Math.ceil(film.pluckCount * 0.8), hi = Math.floor(film.pluckCount * 1.2);
  check('pluck onsets within 20% (' + lo + '..' + hi + ' of ' + film.pluckCount + ')',
    onsets >= lo && onsets <= hi,
    'detected=' + onsets + ' per-window=[' + perWin.join(', ') + ']');

  // 7. bell: 587.33Hz energy appears after t=51
  const gBellPost = goertzel(x, 587.33, B(51.1), B(54));
  const gBellPre = goertzel(x, 587.33, B(49.9), B(50.9));
  check('bell energy after t=51', gBellPost > 0.002 && gBellPost > 4 * gBellPre,
    'post=' + f4(gBellPost) + ' pre=' + f4(gBellPre));

  // 8. seek determinism: render 8s starting at t=25
  const y = await render(film, 25, 8);
  const yRms = rms(y, 0.1, 8);
  check('seek render (t=25, 8s) not silent', yRms > 0.005, 'rms=' + f4(yRms));
  const sDet = goertzel(y, fDet, 0.15, 1.15);     // film 25.1..26.1
  const sPure = goertzel(y, fPure, 0.15, 1.15);
  check('seek render pedal detune matches curve at t=25', sDet > 3 * sPure,
    'gDetuned=' + f4(sDet) + ' gPureFifth=' + f4(sPure));

  // 9. robustness: empty events / missing curves must not crash
  let robust = true, rDetail = 'rendered 3s with defaults';
  try {
    const z = await render({}, 0, 3);
    let bad = 0;
    for (let i = 0; i < z.length; i++) if (!isFinite(z[i])) bad++;
    rDetail += ', rms=' + f4(rms(z, 0, 3)) + ', nonfinite=' + bad;
    robust = bad === 0;
  } catch (err) { robust = false; rDetail = 'threw: ' + err; }
  check('no crash on empty film (default curves)', robust, rDetail);

  say('');
  say('VERDICT: ' + (checks.every(c => c) ? 'PASS' : 'FAIL'));
}

main().catch(err => {
  say('HARNESS ERROR: ' + (err.stack || err));
  say('VERDICT: FAIL');
}).then(() => {
  const pre = document.createElement('pre');
  pre.textContent = lines.join('\n');
  document.body.appendChild(pre);
  document.title = 'DONE';
});
</script>
</body>
</html>
